<style>
/* below you will find a set of CSS variables you can edit to style the header */
body {
  --header-link-color: #0F4BBD; /* header link text color */
  --header-link-hover-color: #0C3C97; /* header link hovor color */
  --header-background-color: #FFFFFF; /* header background color */
  
  --header-login-text-color: #FFFFFF; /* login button text color */
  --header-login-background-color: #0F4BBD; /* login button background color */
  --header-login-background-hover-color: #0C3C97; /* login button background hover color */
}
</style>
<script>
/* Continuous template: the menu is built from the site settings (window.CT_MENU);
   the links below are only used if the settings block is missing. */
var HEADER_LINKS = window.CT_MENU || {
  /* start static header link */
  "Home": {
      "href": "/",
      "target": "_self",
  },
  /* end static header link */
  /* start nested header link */
  /* Continuous template, 28 Sept 2026: the topic pages are now built automatically
     from course tags (ctsection:<topic>), so the menu points at them. Relative links,
     so the same menu works on every domain. */
  "Learning Catalogs": {
    "nestedLinks": {
        "All courses": {
          "href": "/#all",
          "target": "_self",
        },
        "Banking Expertise": {
          "href": "/#subject-banking",
          "target": "_self",
        },
        "OpCon Training": {
          "href": "/#subject-opcon",
          "target": "_self",
        },
        "Permission Assist": {
          "href": "/#subject-permissionassist",
          "target": "_self",
        },
        "Application Support": {
          "href": "/#subject-appsupport",
          "target": "_self",
        },
        "Live training": {
          "href": "/#format-live",
          "target": "_self",
        },
    }
  },
  /* end nested header link */
}
/* DO NOT MODIFY ANYTHING BELOW THIS LINE */
</script>
<style>
#header{
  background-color: var(--header-background-color) !important;
}  
#header .header-nested-wrapper .header-nested-links {
    background-color: var(--header-background-color);
    border: 1px solid rgba(0,0,0,.08);
    box-shadow: 0 4px 12px 0 rgb(0 0 0 / 15%);
    left: 16px;
    opacity: 0;
    padding: 12px 0;
    pointer-events: none;
    position: absolute;
    top: 100%;
    transform: translateY(-8px);
    transition: .4s ease;
    z-index: 99;
    border-radius: 0;
}
.header-link {
    color: var(--header-link-color);
    white-space: nowrap;
}
a.header-link:hover {
    color: var(--header-link-hover-color);
}
.header-mobile-dropdown{
    background-color: var(--header-background-color);
    top: 45px;
    position: absolute;
}
#header i.fa.fa-caret-down, .header-mobile-dropdown i.fa.fa-caret-down, .header-link .fa-external-link {
  margin-left: 5px;
}
.header-mobile-dropdown .header-link{
  color: var(--header-link-color);
}
#header #header-right .login-link {
    background-color: var(--header-login-background-color);
    border-radius: 4px;
    color: var(--header-login-text-color);
    margin-right: 0;
    padding: 12px 24px;
}
#header #header-right .login-link:hover {
    background-color: var(--header-login-background-hover-color);
}
i.fa.fa-bars {
    color: var(--header-login-background-hover-color);
}
.header-link:focus{
  box-shadow: 0 0 0 3px #50aedc;
}

@media(max-width: 962px){
  #header-right .header-mobile-menu{
    display:block;
  }
}
/* Class that closes hover effect on click for links that open in new tab */
.hidden-link{
  display: none;
}
</style>

<!-- START Interactive Quick Checks -->
<!--
  Turns every static Quick Check block in an HTML lesson into a clickable check.

  WHERE THIS GOES
  Skilljar dashboard > Theming > your theme > Code Snippets > Global code snippet.
  Paste this at the END of what is already in that field. Do not remove the
  existing course separator, coursebox, or survey code.

  NO LESSON EDITS NEEDED
  It finds a Quick Check by the markup the lessons already ship with:
    - a paragraph whose only text is "Quick Check"
    - a <ul> of options inside the same block
    - the correct option marked with a checkmark (&#10003;)
    - a paragraph starting with "Why:"
  If all four are not present, the block is left alone. Nothing else on the
  page is touched. If this snippet is removed or errors out, every Quick Check
  falls back to exactly how it renders today.

  BEHAVIOR
  Learner clicks an option. Wrong turns red and locks, the others stay live so
  they can try again. Correct turns green, the checkmark comes back, the Why
  line appears, the block locks. Ungraded. Nothing is tracked or reported.

  This file is deliberately plain ASCII. The checkmark is built with
  String.fromCharCode so a copy-paste or an editor re-encode cannot mangle it.
-->
<style>
  .cqc-opt {
    display: block;
    background: #ffffff;
    border: 1px solid #cfe6d6;
    border-radius: 6px;
    padding: 10px 14px;
    margin: 8px 0;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, opacity .2s ease;
  }
  .cqc-opt:hover { background: #f4faf6; border-color: #9fd3b3; }
  .cqc-opt:focus { outline: 2px solid #0f4bbd; outline-offset: 2px; }
  .cqc-locked { pointer-events: none; }
  .cqc-dim { opacity: .45; }
  .cqc-hint {
    font-size: 13px;
    color: #5c7a67;
    margin: 0 0 10px;
    font-family: 'BDO Grotesk', 'Inter', system-ui, sans-serif;
  }
  .cqc-why { transition: opacity .25s ease; }
</style>
<script>
(function () {
  'use strict';

  /* Shuffle the options on every load.
     In the source lessons the correct answer sits in the middle slot 143 times
     out of 156 and in the first slot the other 13, never last. Static that was
     harmless. Clickable it is not: always picking the middle option would score
     92 percent. Shuffling removes the pattern without editing any lesson.
     Set this to false to render the options in their authored order. */
  var SHUFFLE = true;

  var TICK = String.fromCharCode(10003);
  var TICK_HTML = '&#10003;';
  var GREEN = '#2e7d32', GREEN_BG = '#f0faf0';
  var RED = '#c62828', RED_BG = '#fff5f5';
  var BODY = '#132739';

  function textOf(el) {
    return (el.textContent || '').replace(/\s+/g, ' ').trim();
  }

  function childListItems(list) {
    var out = [];
    for (var i = 0; i < list.children.length; i++) {
      if (list.children[i].tagName === 'LI') out.push(list.children[i]);
    }
    return out;
  }

  function stripTick(html) {
    var s = html.replace(/^\s+/, '');
    if (s.indexOf(TICK_HTML) === 0) s = s.slice(TICK_HTML.length);
    else if (s.charAt(0) === TICK) s = s.slice(1);
    return s.replace(/^(\s|&nbsp;)+/, '');
  }

  function findBlocks() {
    var found = [];
    var paras = document.querySelectorAll('p');
    for (var i = 0; i < paras.length; i++) {
      if (textOf(paras[i]).toLowerCase() !== 'quick check') continue;
      var block = paras[i].parentNode;
      if (!block || block.nodeType !== 1) continue;
      if (found.indexOf(block) === -1) found.push(block);
    }
    return found;
  }

  function lock(el) {
    if (el.className.indexOf('cqc-locked') === -1) el.className += ' cqc-locked';
    el.setAttribute('tabindex', '-1');
  }

  function setup(block) {
    if (block.getAttribute('data-cqc-ready') === '1') return;

    var list = block.querySelector('ul');
    if (!list) return;

    var opts = childListItems(list);
    if (opts.length < 2) return;

    var answer = null, i;
    for (i = 0; i < opts.length; i++) {
      if (textOf(opts[i]).indexOf(TICK) === 0) { answer = opts[i]; break; }
    }
    if (!answer) return;

    var why = null;
    var paras = block.querySelectorAll('p');
    for (i = 0; i < paras.length; i++) {
      if (textOf(paras[i]).toLowerCase().indexOf('why:') === 0) { why = paras[i]; break; }
    }

    block.setAttribute('data-cqc-ready', '1');

    /* Take the checkmark off the correct option and hold it for later. */
    var answerHTML = stripTick(answer.innerHTML);
    answer.innerHTML = answerHTML;

    /* Hide the explanation until they get it right. */
    if (why) {
      why.className += ' cqc-why';
      why.style.display = 'none';
      why.style.opacity = '0';
    }

    /* Reorder so the answer is not always in the same slot. */
    if (SHUFFLE && opts.length > 1) {
      for (i = opts.length - 1; i > 0; i--) {
        var r = Math.floor(Math.random() * (i + 1));
        var swap = opts[i]; opts[i] = opts[r]; opts[r] = swap;
      }
      for (i = 0; i < opts.length; i++) list.appendChild(opts[i]);
    }

    /* Make every option look and read the same, so nothing gives the answer away. */
    list.style.paddingLeft = '0';
    list.style.listStyle = 'none';
    for (i = 0; i < opts.length; i++) {
      opts[i].className += ' cqc-opt';
      opts[i].style.color = BODY;
      opts[i].style.fontWeight = '400';
      opts[i].setAttribute('role', 'button');
      opts[i].setAttribute('tabindex', '0');
    }

    var hint = document.createElement('p');
    hint.className = 'cqc-hint';
    hint.appendChild(document.createTextNode('Pick an answer.'));
    list.parentNode.insertBefore(hint, list);

    var solved = false;

    function answerWith(opt) {
      if (solved || opt.className.indexOf('cqc-locked') !== -1) return;

      if (opt === answer) {
        solved = true;
        opt.innerHTML = TICK_HTML + '&nbsp; ' + answerHTML;
        opt.style.borderColor = GREEN;
        opt.style.background = GREEN_BG;
        opt.style.color = GREEN;
        opt.style.fontWeight = '600';
        lock(opt);

        for (var k = 0; k < opts.length; k++) {
          if (opts[k] === opt) continue;
          if (opts[k].style.borderColor !== RED) opts[k].className += ' cqc-dim';
          lock(opts[k]);
        }

        hint.textContent = 'Correct.';
        hint.style.color = GREEN;

        if (why) {
          why.style.display = '';
          setTimeout(function () { why.style.opacity = '1'; }, 20);
        }
      } else {
        opt.style.borderColor = RED;
        opt.style.background = RED_BG;
        opt.style.color = RED;
        lock(opt);
        hint.textContent = 'Not quite. Try another one.';
        hint.style.color = RED;
      }
    }

    for (i = 0; i < opts.length; i++) {
      (function (opt) {
        opt.addEventListener('click', function () { answerWith(opt); });
        opt.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ' || e.keyCode === 13 || e.keyCode === 32) {
            e.preventDefault();
            answerWith(opt);
          }
        });
      })(opts[i]);
    }
  }

  function run() {
    var blocks = findBlocks();
    for (var i = 0; i < blocks.length; i++) {
      try { setup(blocks[i]); } catch (err) { /* leave that block static */ }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }
  /* Re-scan in case the lesson body paints late. Setup is idempotent. */
  setTimeout(run, 400);
  setTimeout(run, 1500);
})();
</script>

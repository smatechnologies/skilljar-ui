<!-- Kept from the live Learning theme (2 Oct 2026), appended UNCHANGED to the code paste file by tools/build.pl,
     apart from: the header colours (now Community's), and HEADER_LINKS, which now reads window.CT_MENU
     (built from the footer settings) and falls back to the old menu. Dropped: the 600px-tall tile rule
     (clashed with the new cards; still in releases/before-2026-10-02-learning/). -->
<style>
/* below you will find a set of CSS variables you can edit to style the header */
body {
  --header-link-color: #01111F; /* header link text color */
  --header-link-hover-color: #0F4BBD; /* header link hovor color */
  --header-background-color: #FFFFFF; /* header background color */
  
  --header-login-text-color: #FFFFFF; /* login button text color */
  --header-login-background-color: #0F4BBD; /* login button background color */
  --header-login-background-hover-color: #3F6FCA; /* login button background hover color */
}
</style>
<script>
/* Continuous Learning: the menu is built from the site settings (window.CT_MENU); the old menu below is the fallback. */
var HEADER_LINKS = window.CT_MENU || {
  /* start static header link */
  "Home": {
      "href": "https://learning.continuous.com/",
      "target": "_self",
  },
  /* end static header link */
  /* start nested header link */
  "Learning Catalogs": {
    "nestedLinks": {
        "OPCON Training": {
          "href": "https://learning.continuous.com/page/opcon-training",
        },
         "Permission Assist Training": {
          "href": "https://learning.continuous.com/page/permission-assist-training",
        },
    }
  },
  /* end nested header link */
}
/* DO NOT MODIFY ANYTHING BELOW THIS LINE */
</script>
<style>
#header{
  background-color: var(--header-background-color) !important;
}  
#header .header-nested-wrapper .header-nested-links {
    background-color: var(--header-background-color);
    border: 1px solid rgba(0,0,0,.08);
    box-shadow: 0 4px 12px 0 rgb(0 0 0 / 15%);
    left: 16px;
    opacity: 0;
    padding: 12px 0;
    pointer-events: none;
    position: absolute;
    top: 100%;
    transform: translateY(-8px);
    transition: .4s ease;
    z-index: 99;
    border-radius: 0;
}
.header-link {
    color: var(--header-link-color);
    white-space: nowrap;
}
a.header-link:hover {
    color: var(--header-link-hover-color);
}
.header-mobile-dropdown{
    background-color: var(--header-background-color);
    top: 45px;
    position: absolute;
}
#header i.fa.fa-caret-down, .header-mobile-dropdown i.fa.fa-caret-down, .header-link .fa-external-link {
  margin-left: 5px;
}
.header-mobile-dropdown .header-link{
  color: var(--header-link-color);
}
#header #header-right .login-link {
    background-color: var(--header-login-background-color);
    border-radius: 4px;
    color: var(--header-login-text-color);
    margin-right: 0;
    padding: 12px 24px;
}
#header #header-right .login-link:hover {
    background-color: var(--header-login-background-hover-color);
}
i.fa.fa-bars {
    color: var(--header-login-background-hover-color);
}
.header-link:focus{
  box-shadow: 0 0 0 3px #50aedc;
}

@media(max-width: 962px){
  #header-right .header-mobile-menu{
    display:block;
  }
}
/* Class that closes hover effect on click for links that open in new tab */
.hidden-link{
  display: none;
}
</style>

<!-- START Create Course Separators on Pages -->
<script>
var textAlignment = 'center' /* change value to 'left' for left aligned sections */

/* This section removes the text '[separator]' from the course title */
/* Used so admins can easily identify separator courses in the admin backend */
document.addEventListener('DOMContentLoaded', function() {
    var courseboxContainers = document.querySelectorAll('.coursebox-container');
    
    courseboxContainers.forEach(function(container) {
        var courseboxText = container.querySelector('.coursebox-text');
        var lowercaseText = courseboxText.textContent.toLowerCase();
        if (lowercaseText.indexOf('[separator]') !== -1) {
            /* check for both upper case and lower case versions in case of admin mistake */
            courseboxText.textContent = courseboxText.textContent.replace('[separator]', '');
            courseboxText.textContent = courseboxText.textContent.replace('[Separator]', '');
            container.style.textAlign = textAlignment;
        }
    });
});
</script>
<style>
/* Set font size for separator titles */
a.coursebox-container[data-tags*="separator"] .coursebox-text {
  font-size:30px !important;
}
/* Set font size for separator sub-titles */
a.coursebox-container[data-tags*="separator"] .coursebox-text-description {
  font-size:18px !important;
  margin: 10px 0 0 !important;
}
/* remove conflicting standard tile styles */
a.coursebox-container[data-tags*="separator"]:after {
  display: none !important;
}
/* remove all standard course tile styling, add 100% page width */  
a.coursebox-container[data-tags*="separator"] {
  padding: 20px !important;  
  width: 87% !important;
  min-height: unset !important;
  background-color: transparent !important;    
  box-shadow: none !important; 
  pointer-events: none !important;
  border: none !important;
}

/* Hide course price/CTA text, tile image. Hide separator courses from search */
a.coursebox-container[data-tags*="separator"] .storefront-price,
.search a.coursebox-container[data-tags*="separator"],
a.coursebox-container[data-tags*="separator"] .coursebox-image, a.coursebox-container[data-tags*="separator"] .coursebox-callout {
  display: none !important;
}
</style>
<!-- END Create Course Separators on Pages -->
